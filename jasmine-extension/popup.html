<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jasmine Avcı</title>
    <style>
      :root { color-scheme: dark; }
      body {
        width: 340px;
        margin: 0;
        padding: 20px;
        background: #07111f;
        color: #e5edf7;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      h1 { margin: 0 0 6px; font-size: 19px; }
      p { margin: 0 0 18px; color: #9fb0c5; }
      label { display: block; margin: 12px 0 6px; font-weight: 650; }
      input {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #26364b;
        border-radius: 8px;
        background: #0b1729;
        color: inherit;
      }
      button, a {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 11px 14px;
        border: 0;
        border-radius: 8px;
        background: #10b981;
        color: #02150f;
        font-weight: 750;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }
      button.secondary {
        margin-top: 8px;
        border: 1px solid #334155;
        background: #0f1d31;
        color: #dbe7f5;
      }
      button.secondary:hover { background: #16263d; }
      button:disabled { opacity: .55; cursor: wait; }
      #status { min-height: 42px; margin-top: 14px; font-size: 13px; }
      #status[data-kind="error"] { color: #fca5a5; }
      #status[data-kind="success"] { color: #6ee7b7; }
      .notice {
        margin-top: 16px;
        padding: 10px;
        border: 1px solid #334155;
        border-radius: 8px;
        color: #aebdd0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Bu aramayı Avcı’ya aktar</h1>
    <p>Yalnızca açık filtre URL’si ve ekranda görünen ilan satırları aktarılır.</p>

    <label for="appUrl">Jasmine adresi</label>
    <input id="appUrl" type="url" autocomplete="url" />

    <label for="sourceAuthorizationId">Kaynak yetki kaydı (isteğe bağlı)</label>
    <input id="sourceAuthorizationId" type="text" autocomplete="off" />

    <button id="transferButton" type="button">Aramayı iş kuyruğuna al</button>
    <button class="secondary" id="exportButton" type="button">
      İlan paketini JSON olarak indir
    </button>
    <div id="status" role="status" aria-live="polite"></div>
    <a id="jobLink" href="#" target="_blank" rel="noreferrer" hidden>Avcı’da ilerlemeyi aç</a>

    <div class="notice">
      Eklenti ilan detayına girmez, yeni sekme açmaz, telefon göstermez ve
      güvenlik engellerini aşmaya çalışmaz.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
